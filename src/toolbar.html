<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Harness Widget</title>
<style>
  :root {
    --bar-bg: #171a21;
    --bar-fg: #e6e8ee;
    --bar-dim: #8a90a0;
    --bar-border: #262a35;
    --btn-hover: rgba(255, 255, 255, 0.08);
    --btn-active: rgba(255, 255, 255, 0.14);
    --ok: #3ecf8e;
    --bad: #ef5f5f;
    --accent: #5b8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bar-bg: #f4f5f8;
      --bar-fg: #1c1f26;
      --bar-dim: #6b7280;
      --bar-border: #dfe2e8;
      --btn-hover: rgba(0, 0, 0, 0.06);
      --btn-active: rgba(0, 0, 0, 0.1);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font: 12px/1 "Segoe UI", system-ui, sans-serif;
    color: var(--bar-fg);
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    user-select: none;
    -webkit-app-region: drag;
  }
  .bar { display: flex; align-items: center; height: 100%; padding: 0 4px 0 10px; gap: 8px; }
  .identity { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bar-dim);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--bar-dim) 18%, transparent);
    flex: none;
    transition: background 0.2s;
  }
  .dot.up { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.down { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }
  .title { font-weight: 600; letter-spacing: 0.2px; white-space: nowrap; }
  .host { color: var(--bar-dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
  button {
    -webkit-app-region: no-drag;
    display: grid; place-items: center;
    width: 28px; height: 24px;
    border: 0; border-radius: 6px;
    background: transparent; color: var(--bar-fg);
    cursor: pointer; padding: 0;
    outline: none;
    transition: background 0.12s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { background: var(--btn-active); }
  button:focus-visible { background: var(--btn-hover); }
  button.on { color: var(--accent); }
  button.close:hover { background: #d64545; color: #fff; }
  button svg { width: 15px; height: 15px; display: block; }
  .sep { width: 1px; height: 16px; background: var(--bar-border); margin: 0 3px; }
  [data-icon="mode-window"] { display: none; }
  body[data-mode="window"] [data-icon="mode-window"] { display: block; }
  body[data-mode="window"] [data-icon="mode-panel"] { display: none; }
</style>
</head>
<body data-mode="panel">
  <div class="bar">
    <div class="identity" title="Harness">
      <span class="dot" id="dot"></span>
      <span class="title">Harness</span>
      <span class="host" id="host"></span>
    </div>
    <div class="actions">
      <button id="pin" title="Поверх всех окон">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17v5" /><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6z" />
        </svg>
      </button>
      <button id="mode" title="Панель / полное окно">
        <svg data-icon="mode-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="16" rx="2" /><path d="M15 4v16" />
        </svg>
        <svg data-icon="mode-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="5" width="18" height="14" rx="2" />
        </svg>
      </button>
      <span class="sep"></span>
      <button id="settings" title="Настройки интерфейса">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <button id="reload" title="Обновить страницу">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3-6.7" /><path d="M21 4v5h-5" />
        </svg>
      </button>
      <button id="close" class="close" title="Скрыть в трей (Ctrl+Alt+H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  </div>

<script>
  const body = document.body;
  const dot = document.getElementById('dot');
  const host = document.getElementById('host');
  const pin = document.getElementById('pin');

  function render(state) {
    if (!state) return;
    body.dataset.mode = state.mode === 'window' ? 'window' : 'panel';
    pin.classList.toggle('on', !!state.alwaysOnTop);
    document.getElementById('settings').classList.toggle('on', !!state.settingsOpen);
    dot.classList.toggle('up', !!state.serverUp);
    dot.classList.toggle('down', state.serverUp === false);
    host.textContent = state.url || '';
    document.getElementById('mode').title = state.mode === 'window'
      ? 'Свернуть в компактную панель'
      : 'Развернуть в полное окно';
    // В режиме стекла шапка тоже пропускает размытый задник.
    if (state.glass) {
      const percent = Math.round(Math.min(1, state.glassAlpha ?? 0.55) * 100);
      body.style.background = `color-mix(in srgb, var(--bar-bg) ${percent}%, transparent)`;
    } else {
      body.style.background = '';
    }
  }

  document.getElementById('close').addEventListener('click', () => window.widget.action('close'));
  document.getElementById('reload').addEventListener('click', () => window.widget.action('reload'));
  document.getElementById('pin').addEventListener('click', () => window.widget.action('toggle-pin'));
  document.getElementById('mode').addEventListener('click', () => window.widget.action('toggle-mode'));
  document.getElementById('settings').addEventListener('click', () => window.widget.action('open-settings'));

  window.widget.onState(render);
  window.widget.getState().then((state) => {
    render(state);
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
  });
</script>
</body>
</html>
